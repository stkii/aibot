services:
  aibot:
    build: .
    image: aibot:latest
    container_name: aibot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 両方のDB・補助ファイル・ログを永続化する。
      - aibot-data:/app/data
      # 設定ファイルがなければ、ディレクトリを作らず起動を失敗させる。
      - type: bind
        source: ./resources/agents.yml
        target: /app/resources/agents.yml
        read_only: true
        bind:
          create_host_path: false

volumes:
  aibot-data:
